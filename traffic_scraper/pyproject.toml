[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "traffic-scraper"
version = "0.1.0"
description = "Automated traffic data collection system for Thu Duc, Ho Chi Minh City using TomTom Routing API."
readme = "README.md"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v"
