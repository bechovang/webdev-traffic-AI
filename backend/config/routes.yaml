scraper:
  interval_minutes: 15
  collection_days: 7
  api_provider: "tomtom"
  polling_start_time: "00:00"
  polling_end_time: "23:45"

storage:
  data_dir: "data/scraped_data"
  reports_dir: "data/reports"
  failed_routes_file: "data/failed_routes.csv"
  daily_file_prefix: "traffic_data"
  summary_file_prefix: "summary"

logging:
  level: "INFO"
  format: "json"
  rotation: "daily"
  retention_days: 7
